name: Scan CIT Chennai hackathon emails

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan Gmail for hackathon announcements
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 fetch_emails.py

      - name: Commit and push updated event data
        run: |
          git add hackathons.json
          if ! git diff --cached --quiet --exit-code; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update hackathons from CIT Chennai emails"
            git push
          else
            echo "hackathons.json is unchanged."
          fi
